name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Start Azurite (blob landing zone)
        run: >
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/local init -backend=false
          terraform -chdir=infra/terraform/local validate
          terraform -chdir=infra/terraform/azure init -backend=false
          terraform -chdir=infra/terraform/azure validate
      - name: Wait for Azurite
        run: |
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/10000) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Azurite did not become reachable" >&2
          exit 1
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
