services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - marts:/marts

  dashboard:
    build:
      context: ./dashboard
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - marts:/marts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  marts:
